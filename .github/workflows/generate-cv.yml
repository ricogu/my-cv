name: CI

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build LaTeX Document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: rico-cv.tex

      - name: Clean up auxiliary files
        run: rm -f *.aux *.log *.out *.toc *.fls *.fdb_latexmk

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install jinja2 pyyaml

      - name: Build website (render index.html from template)
        run: python scripts/build-site.py

      - name: Deploy to gh-pages (merge, not replace)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch latest gh-pages to avoid race conditions with concurrent runs
          git fetch origin gh-pages

          # Checkout gh-pages into a temp directory
          git worktree add /tmp/gh-pages-deploy origin/gh-pages

          # Copy built artifacts into gh-pages (overwrite only these files)
          cp build/index.html /tmp/gh-pages-deploy/index.html
          cp rico-cv.pdf /tmp/gh-pages-deploy/rico-cv.pdf

          # Commit and push if there are changes
          cd /tmp/gh-pages-deploy
          git add index.html rico-cv.pdf
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "deploy: ${{ github.sha }}"
            # Retry push: fetch & rebase if rejected due to concurrent deploy
            git push origin HEAD:gh-pages || {
              git fetch origin gh-pages
              git rebase origin/gh-pages
              git push origin HEAD:gh-pages
            }
          fi

      - name: Send notification on success
        if: success()
        run: echo "Build and deploy succeeded!"

      - name: Send notification on failure
        if: failure()
        run: echo "Build and deploy failed!"
